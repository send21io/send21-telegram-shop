<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📱 mock Telegram · send21 shop</title>
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/phone.css">
<script src="/phone.js" defer></script>
</head>
<body>
<div class="phone">
  <header class="bar">
    <div class="avatar" id="avatar" aria-hidden="true">🛍️</div>
    <div class="who"><b id="title">shop</b><small id="sub">bot</small></div>
    <nav class="tabs" id="tabs" aria-label="chats"></nav>
  </header>
  <main id="log" class="log" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <form id="compose" class="compose" autocomplete="off">
    <input id="text" name="text" maxlength="500" placeholder="Message the shop…" aria-label="message">
    <button aria-label="send">➤</button>
  </form>
  <p class="mock">🧪 mock Telegram · no token, no network</p>
</div>
</body>
</html>
